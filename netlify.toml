# Netlify build config — armada-interface deploy (standalone repo; app is at the repo root).
#
# Env vars set in the Netlify UI (not committed):
#   VITE_WALLETCONNECT_PROJECT_ID  required for WalletConnect modal
#   VITE_RELAYER_URL               public relayer endpoint when the VPS is live
#                                  (omit until then — submit flows will error,
#                                   but UI/flow review still works)
#   DEPLOYMENT_INSTANCE            optional override; defaults to "demo3"
#                                  (build-step variable only, no VITE_ prefix
#                                   because it's never exposed to bundled JS)
#   DEPLOYMENT_REF                 optional — commit SHA of ship-armada/armada-deployments to
#                                  fetch manifests from; defaults to the mutable `main` branch
#                                  when unset (P1-23). These manifests carry fund-receiving
#                                  addresses, so PIN to a SHA for production to freeze them; the
#                                  `main` default is convenient but floats. Bump per release. Non-VITE.

[build]
  publish = "dist"
  # Build flow:
  #   1. install with `npm ci` (respects the committed lockfile — never re-resolves the dep graph
  #      fresh). The package.json `postinstall` runs ensure-linux-native-modules.mjs to work around
  #      Vercel/Netlify npm optional-native bug #4828 (rollup/lightningcss/oxide linux binaries).
  #   2. fetch the selected deployment instance's manifests from the armada-deployments repo (driven
  #      by that instance's manifest.json index — no hardcoded chain list) into public/api/deployments/
  #   3. verify the committed ZK artifacts, then build
  command = """
    npm ci && \
    node scripts/fetch-sepolia-deployments.mjs && \
    npm run prepare:artifacts && \
    npm run build
  """

[build.environment]
  NODE_VERSION = "20"
  # Bump V8 heap above the ~2 GB default. Vite's bundle phase is memory-heavy:
  # deduping the RainbowKit transitive graph (multiple `ox`/viem variants via
  # WalletConnect + Coinbase Wallet SDK + Reown AppKit) plus the SDK WASM +
  # snarkjs payload. Enabling Sentry's `hidden` source maps (when SENTRY_AUTH_TOKEN
  # is set) pushes peak heap past 4 GB, so we run at 6144 — the safe ceiling for
  # Netlify's 8 GB Pro build container (leaves ~2 GB for node overhead). Do NOT set
  # this above container RAM: a value with no headroom flips the OOM into a SIGKILL
  # (exit 137). If 6144 still OOMs (clean V8 "heap out of memory"), the box can't
  # generate full maps for this bundle — drop SENTRY_AUTH_TOKEN to build without
  # maps, or code-split the SDK/RainbowKit more aggressively.
  NODE_OPTIONS = "--max-old-space-size=6144"
  # Switches all network-dependent decisions in the app (manifest filename
  # suffix, hub chain id + RPC, explorer URLs, poll cadence) to sepolia.
  VITE_NETWORK = "sepolia"

# SPA fallback — react-router serves /debug, /pay-via-link, etc.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers (P0-8). KEEP IN SYNC with vercel.json's "headers" — the CSP value below must be
# byte-identical across both deploy targets. COOP/COEP are deliberately omitted: snarkjs here runs
# without SharedArrayBuffer, and COEP would break Google Fonts + WalletConnect iframes.
#
# The CSP ships as Content-Security-Policy-Report-Only FIRST so it can't break a flow before a
# human has clicked through every path on a preview deploy with devtools open. Promote to the
# enforcing `Content-Security-Policy` header only after that sweep — and AFTER adding the runtime
# relayer origin (VITE_RELAYER_URL host) and any IPFS artifact-gateway host to connect-src, neither
# of which is statically known here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://ethereum-sepolia-rpc.publicnode.com https://sepolia.base.org https://sepolia-rollup.arbitrum.io https://iris-api-sandbox.circle.com wss://relay.walletconnect.com https://*.walletconnect.com https://*.walletconnect.org https://*.rainbow.me https://*.sentry.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
